# Deliver the NEWEST special edition's PDF to the reMarkable cloud.
#
# AUTOMATIC for specials (editor, 16 Aug 2026): a special is a
# reader-commissioned deep dive — it is always wanted, so it ships to the
# tablet the moment it is promoted (state/specials.json changes on main).
# DAILY editions stay MANUAL by contrast (see deliver-remarkable.yml) so the
# tablet doesn't silt up with issues the reader may not want offline.
# The chrome's "⇥ Send newest special to tablet" menu entry and the Actions
# tab both still work for a re-send; the upload is idempotent by name.
name: Deliver special edition to reMarkable

on:
  push:
    branches: [main]
    paths: ["state/specials.json"]
  workflow_dispatch:

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if not paired or no specials
        id: gate
        env:
          PASSPHRASE: ${{ secrets.RMAPI_PASSPHRASE }}
        run: |
          COUNT=$(python3 -c "import json;print(len(json.load(open('state/specials.json')).get('specials',[])))")
          if [ -z "$PASSPHRASE" ] || [ ! -f assets/remarkable/rmapi.conf.enc ] || [ "$COUNT" = "0" ]; then
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        if: steps.gate.outputs.go == 'yes'
        with: { go-version: 'stable' }
      - name: Install rmapi
        if: steps.gate.outputs.go == 'yes'
        run: |
          git clone --depth 1 https://github.com/ddvk/rmapi /tmp/rmapi-src
          cd /tmp/rmapi-src && go build -o "$HOME/rmapi" .
      - name: Deliver the newest special
        if: steps.gate.outputs.go == 'yes'
        env:
          PASSPHRASE: ${{ secrets.RMAPI_PASSPHRASE }}
        run: |
          mkdir -p ~/.config/rmapi
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:PASSPHRASE \
            -in assets/remarkable/rmapi.conf.enc -out ~/.config/rmapi/rmapi.conf
          RMAPI="$HOME"/rmapi
          NO=$(python3 -c "import json;print(json.load(open('state/specials.json'))['specials'][-1]['no'])")
          # ASCII-fold the topic: the reMarkable API 400s on non-ASCII filenames
          # ("MERIDIAN No. 75.5 - SPECIAL - The Hermès Kelly Bag.pdf" failed).
          TOPIC=$(python3 -c "import json,unicodedata,re;t=json.load(open('state/specials.json'))['specials'][-1]['topic'];t=unicodedata.normalize('NFKD',t).encode('ascii','ignore').decode();print(re.sub(r'[^A-Za-z0-9 ,.&()-]+',' ',t).strip())")
          PDF=$(python3 -c "import json;print(json.load(open('state/specials.json'))['specials'][-1]['pdf'])")
          NAME="MERIDIAN No. $NO - SPECIAL - $TOPIC"
          $RMAPI mkdir /MERIDIAN 2>/dev/null || true
          # The reMarkable cloud 400s on large uploads: a 3.2MB special
          # delivered fine, a 4.0MB one failed twice. Compress anything over
          # ~3MB with ghostscript before uploading (text stays sharp; the
          # photo heroes are print-hidden anyway, so quality loss is minimal).
          SZ=$(stat -c%s "$PDF")
          if [ "$SZ" -gt 3100000 ]; then
            echo "PDF is $SZ bytes — compressing before upload"
            sudo apt-get update -qq && sudo apt-get install -y -qq ghostscript || true
            if command -v gs >/dev/null; then
              gs -sDEVICE=pdfwrite -dCompatibilityLevel=1.4 -dPDFSETTINGS=/ebook \
                 -dNOPAUSE -dQUIET -dBATCH -sOutputFile=/tmp/_small.pdf "$PDF" && \
                 NEW=$(stat -c%s /tmp/_small.pdf) && echo "compressed to $NEW bytes" && \
                 [ "$NEW" -lt "$SZ" ] && [ "$NEW" -gt 100000 ] && PDF=/tmp/_small.pdf
            else
              echo "ghostscript unavailable — uploading original, may 400"
            fi
          fi
          # idempotence: a re-click on the menu item must not error or duplicate
          if $RMAPI ls /MERIDIAN | grep -qF "$NAME"; then
            echo "already delivered: $NAME — skipping upload"
          else
            cp "$PDF" "$NAME.pdf"
            $RMAPI put "$NAME.pdf" /MERIDIAN
            echo "delivered: $NAME"
          fi
