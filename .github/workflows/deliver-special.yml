# Deliver the NEWEST special edition's PDF to the reMarkable cloud.
#
# AUTOMATIC for specials (editor, 16 Aug 2026): a special is a
# reader-commissioned deep dive — it is always wanted, so it ships to the
# tablet the moment it is promoted (state/specials.json changes on main).
# DAILY editions stay MANUAL by contrast (see deliver-remarkable.yml) so the
# tablet doesn't silt up with issues the reader may not want offline.
# The chrome's "⇥ Send newest special to tablet" menu entry and the Actions
# tab both still work for a re-send; the upload is idempotent by name.
name: Deliver special edition to reMarkable

on:
  push:
    branches: [main]
    paths: ["state/specials.json"]
  workflow_dispatch:

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if not paired or no specials
        id: gate
        env:
          PASSPHRASE: ${{ secrets.RMAPI_PASSPHRASE }}
        run: |
          COUNT=$(python3 -c "import json;print(len(json.load(open('state/specials.json')).get('specials',[])))")
          if [ -z "$PASSPHRASE" ] || [ ! -f assets/remarkable/rmapi.conf.enc ] || [ "$COUNT" = "0" ]; then
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        if: steps.gate.outputs.go == 'yes'
        with: { go-version: 'stable' }
      - name: Install rmapi
        if: steps.gate.outputs.go == 'yes'
        run: |
          git clone --depth 1 https://github.com/ddvk/rmapi /tmp/rmapi-src
          cd /tmp/rmapi-src && go build -o "$HOME/rmapi" .
      - name: Deliver specials missing from the tablet
        if: steps.gate.outputs.go == 'yes'
        env:
          PASSPHRASE: ${{ secrets.RMAPI_PASSPHRASE }}
        run: |
          mkdir -p ~/.config/rmapi
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:PASSPHRASE \
            -in assets/remarkable/rmapi.conf.enc -out ~/.config/rmapi/rmapi.conf
          RMAPI="$HOME"/rmapi
          $RMAPI mkdir /MERIDIAN 2>/dev/null || true
          $RMAPI ls /MERIDIAN > /tmp/_onDevice.txt 2>/dev/null || true
          # SELF-HEALING: walk the most recent specials and upload any the
          # tablet is missing, not just the newest. A special that failed to
          # deliver once (75.5 predates the size fix) would otherwise never
          # arrive, since a later special moves the "newest" pointer past it.
          # Topics are ASCII-folded: the reMarkable API 400s on accented names.
          python3 - <<'PY' > /tmp/_specials.tsv
          import json, unicodedata, re
          sp = json.load(open('state/specials.json'))['specials'][-6:]
          for s in sp:
              t = unicodedata.normalize('NFKD', s['topic']).encode('ascii','ignore').decode()
              t = re.sub(r'[^A-Za-z0-9 ,.&()-]+', ' ', t).strip()
              print(f"{s['no']}\t{t}\t{s['pdf']}")
          PY
          while IFS=$'\t' read -r NO TOPIC PDF; do
            [ -z "$NO" ] && continue
            NAME="MERIDIAN No. $NO - SPECIAL - $TOPIC"
            # Match on the ISSUE NUMBER, not the full name: 74.5 was delivered
            # before the accent-folding fix and sits on the tablet under its
            # original accented name, so a name match would duplicate it.
            if grep -qF "MERIDIAN No. $NO - SPECIAL" /tmp/_onDevice.txt; then
              echo "already on device: No. $NO"; continue
            fi
            if [ ! -f "$PDF" ]; then echo "missing file for $NO: $PDF"; continue; fi
            UP="$PDF"
            SZ=$(stat -c%s "$PDF")
            # reMarkable 400s on large uploads (a 4.0MB special failed twice,
            # 3.2MB succeeded). Compress anything over ~3.1MB first.
            if [ "$SZ" -gt 3100000 ]; then
              echo "$NO is $SZ bytes — compressing"
              command -v gs >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ghostscript || true; }
              if command -v gs >/dev/null; then
                if gs -sDEVICE=pdfwrite -dCompatibilityLevel=1.4 -dPDFSETTINGS=/ebook \
                      -dNOPAUSE -dQUIET -dBATCH -sOutputFile="/tmp/_c_$NO.pdf" "$PDF"; then
                  NEW=$(stat -c%s "/tmp/_c_$NO.pdf")
                  echo "  compressed $SZ -> $NEW bytes"
                  [ "$NEW" -lt "$SZ" ] && [ "$NEW" -gt 100000 ] && UP="/tmp/_c_$NO.pdf"
                fi
              fi
            fi
            cp "$UP" "$NAME.pdf"
            $RMAPI put "$NAME.pdf" /MERIDIAN && echo "delivered: $NAME" || echo "FAILED: $NAME"
            rm -f "$NAME.pdf"
          done < /tmp/_specials.tsv
