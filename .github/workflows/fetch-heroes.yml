# Fetch the hero-image library from Wikimedia Commons into the repo.
#
# The MERIDIAN build sandbox cannot reach Commons (or any image host except
# raw.githubusercontent), so editions self-host their photos: this workflow
# downloads every manifest entry and commits it as assets/heroes/<slug>.jpg.
# make_photo_edition.py then embeds the committed copies. A fetch that fails
# is skipped and logged — a missing image stays missing, never faked.
name: Fetch hero images

on:
  push:
    branches: [main]
    paths: ["assets/heroes/manifest.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download manifest entries
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time, urllib.error, urllib.parse, urllib.request
          # Wikimedia's User-Agent policy REQUIRES a descriptive agent naming the
          # tool and a contact route; a bare token like "meridian-hero-fetch/1.0"
          # is served HTTP 429 "does not comply with our robot policy" no matter
          # how few requests you make. Every build from No. 75 on burned retries
          # on that, reading it as rate-limiting. It was never rate-limiting.
          UA = {"User-Agent": "MeridianHeroFetch/1.1 (https://github.com/markt1600/dailymag; bakery-issue-images)",
                "Accept": "image/*,*/*;q=0.8"}
          API = "https://commons.wikimedia.org/w/api.php"

          def get(url, timeout=60, tries=4):
              """Fetch with polite backoff. 429/503 are transient here, not fatal."""
              for attempt in range(tries):
                  try:
                      return urllib.request.urlopen(
                          urllib.request.Request(url, headers=UA), timeout=timeout).read()
                  except urllib.error.HTTPError as ex:
                      if ex.code not in (429, 503) or attempt == tries - 1:
                          raise
                      time.sleep(2 ** attempt * 3)
              raise RuntimeError("unreachable")

          def filepath(title, width=1600):
              return ("https://commons.wikimedia.org/wiki/Special:FilePath/"
                      + urllib.parse.quote(title.split(":", 1)[-1]) + f"?width={width}")

          def save(dst, url):
              data = get(url)
              if len(data) < 10000:
                  raise ValueError("suspiciously small")
              open(dst, "wb").write(data)
              print("fetched", dst, len(data), "bytes")
              time.sleep(1)          # stay a good citizen across a long manifest

          def catmembers(cat, kind, limit):
              """One page of Commons category members of the given type."""
              q = urllib.parse.urlencode({"action": "query", "list": "categorymembers",
                                          "cmtitle": cat, "cmtype": kind,
                                          "cmlimit": str(limit), "format": "json"})
              return [m["title"] for m in json.loads(get(f"{API}?{q}"))["query"]["categorymembers"]]

          man = json.load(open("assets/heroes/manifest.json"))
          for e in man["images"]:
              # ---- category form: pull a whole Commons category so the build session
              # can EYEBALL the candidates. The sandbox cannot browse Commons, so a
              # category listing is the only way to discover filenames it never saw.
              # Saves <slug>-01.jpg… plus <slug>-index.json mapping file -> title.
              if e.get("category"):
                  idx_path = f"assets/heroes/{e['slug']}-index.json"
                  if os.path.exists(idx_path):
                      print("have", idx_path); continue
                  limit = int(e.get("limit", 12))
                  try:
                      titles = catmembers(e["category"], "file", limit)
                      for sub in catmembers(e["category"], "subcat", 8):
                          if len(titles) >= limit: break
                          titles += [t for t in catmembers(sub, "file", limit - len(titles))]
                  except Exception as ex:
                      print("SKIP category", e["slug"], "-", ex); continue
                  index = {}
                  for i, t in enumerate(titles[:limit], 1):
                      dst = f"assets/heroes/{e['slug']}-{i:02d}.jpg"
                      try:
                          save(dst, filepath(t))
                          index[os.path.basename(dst)] = t
                      except Exception as ex:
                          print("SKIP", t, "-", ex)
                  json.dump(index, open(idx_path, "w"), indent=2, ensure_ascii=False)
                  print("indexed", idx_path, len(index), "files")
                  continue

              dst = f"assets/heroes/{e['slug']}.jpg"
              if os.path.exists(dst) and os.path.getsize(dst) > 10000:
                  print("have", dst); continue
              if e.get("url"):                     # any internet source
                  url = e["url"]
              else:                                # Wikimedia Commons filename
                  url = filepath(e["file"])
              try:
                  save(dst, url)
              except Exception as ex:
                  print("SKIP", e["slug"], "-", ex)
          PY
      - name: Commit fetched images
        run: |
          git config user.name "meridian-heroes"
          git config user.email "actions@users.noreply.github.com"
          git add -A assets/heroes
          git diff --cached --quiet || { git commit -m "assets: fetch hero images from Commons manifest"; git push; }
