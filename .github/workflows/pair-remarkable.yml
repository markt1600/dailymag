# ONE-TIME pairing with the reMarkable cloud.
#
# Run manually (Actions tab -> "Pair reMarkable" -> Run workflow) with the
# 8-character one-time code from https://my.remarkable.com/device/browser/connect
#
# Registers this repo as a "device" via rmapi, then commits the resulting
# auth config ENCRYPTED (AES-256, passphrase from the RMAPI_PASSPHRASE
# secret) as assets/remarkable/rmapi.conf.enc — the repo is public, so the
# token never lands in plaintext. The daily delivery workflow decrypts it
# with the same secret.
name: Pair reMarkable

on:
  workflow_dispatch:
    inputs:
      code:
        description: "One-time code from my.remarkable.com/device/browser/connect"
        required: true

permissions:
  contents: write

jobs:
  pair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - name: Install rmapi
        run: |
          git clone --depth 1 https://github.com/ddvk/rmapi /tmp/rmapi-src
          cd /tmp/rmapi-src && go build -o "$HOME/rmapi" .
      - name: Register with the one-time code
        env:
          CODE: ${{ github.event.inputs.code }}
        run: |
          printf '%s\n' "$CODE" | "$HOME"/rmapi ls
          test -s ~/.config/rmapi/rmapi.conf || { echo "registration failed"; exit 1; }
      - name: Encrypt and commit the auth config
        env:
          PASSPHRASE: ${{ secrets.RMAPI_PASSPHRASE }}
        run: |
          test -n "$PASSPHRASE" || { echo "RMAPI_PASSPHRASE secret not set"; exit 1; }
          mkdir -p assets/remarkable
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:PASSPHRASE \
            -in ~/.config/rmapi/rmapi.conf -out assets/remarkable/rmapi.conf.enc
          git config user.name "meridian-remarkable"
          git config user.email "actions@users.noreply.github.com"
          git add assets/remarkable/rmapi.conf.enc
          git commit -m "reMarkable: store encrypted device pairing"
          git push
          echo "Paired. Future editions will be delivered automatically."
